<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASC 온보딩 — 나에게 맞는 트랙 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>

  :root{
    --ink:#141E3C; --ink-muted:#4B5563; --ink-soft:#9CA3AF;
    --navy:#1E2A4A; --navy-strong:#141E3C; --navy-soft:#EEF0F6;
    --canvas:#FFFFFF; --surface:#F4F6F8; --surface-2:#EDEFF2;
    --hair:#E5E7EB; --strong:#D1D5DB;
    --shadow-card:0 1px 2px 0 rgba(20,30,60,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
    background:var(--canvas); color:var(--ink-muted);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:28px 22px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:560px}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:14px}
  .progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:30px}
  .progress > i{display:block;height:100%;width:0;background:var(--navy);border-radius:99px;transition:width .4s ease}
  .progress.hidden{visibility:hidden}
  .q-count{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);margin-bottom:12px}
  h1{font-size:33px;font-weight:700;letter-spacing:-.02em;line-height:1.14;color:var(--ink);margin-bottom:16px}
  h2.q{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.36;color:var(--ink);margin-bottom:24px}
  .lead{color:var(--ink-muted);font-size:16px;line-height:1.75;margin-bottom:14px}
  .note{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:14px 16px;
    font-size:13px;color:var(--ink-muted);line-height:1.65;margin-bottom:28px}
  .opt{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    background:var(--canvas);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--shadow-card);
    padding:15px 18px;margin-bottom:10px;color:var(--ink);font-size:15px;font-weight:600;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--navy);background:var(--navy-soft)}
  .opt:active{background:var(--surface-2)}
  .opt .em{font-size:20px;line-height:1}
  .btns{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  .ghost{background:none;border:none;color:var(--ink-muted);font-size:13px;font-weight:600;cursor:pointer;padding:8px 4px}
  .ghost:hover{color:var(--ink)}
  .cta{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;
    padding:0 24px;height:48px;border-radius:8px;text-decoration:none;border:none;cursor:pointer;
    transition:background .15s;
  }
  .cta:hover{background:var(--navy-strong)}
  .cta.full{width:100%}
  /* result */
  .result-card{background:var(--canvas);border:1px solid var(--hair);border-radius:12px;padding:28px;margin-bottom:12px;box-shadow:var(--shadow-card)}
  .match{font-size:13px;font-weight:600;color:var(--ink-muted);margin-bottom:18px}
  .match b{color:var(--navy);font-size:16px}
  .match-bar{height:6px;background:var(--surface-2);border-radius:99px;margin-top:8px;overflow:hidden}
  .match-bar > i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .6s ease}
  .typeline{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;letter-spacing:-.01em}
  .result-em{font-size:44px;line-height:1;margin-bottom:14px}
  .badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--navy);background:var(--navy-soft);
    border:1px solid var(--hair);padding:5px 11px;border-radius:99px;margin-bottom:15px}
  .result-card h3{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px}
  .result-card .tag{color:var(--ink-muted);font-size:15px;font-weight:500;margin-bottom:16px}
  .result-card p.why{font-size:14.5px;color:var(--ink-muted);line-height:1.72}
  .sub-card{width:100%;text-align:left;cursor:pointer;font-family:inherit;
    background:var(--canvas);border:1px solid var(--hair);border-radius:10px;padding:15px 18px;box-shadow:var(--shadow-card);
    display:flex;gap:12px;align-items:center;margin-bottom:24px;transition:border-color .15s, background .15s}
  .sub-card:hover{border-color:var(--navy);background:var(--navy-soft)}
  .sub-card .sub-cta{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap}
  .sub-card .em{font-size:26px}
  .sub-card .t{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:2px}
  .sub-card .n{font-size:15px;font-weight:700;color:var(--ink)}
  .fade{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .foot{margin-top:30px;font-size:11px;font-weight:600;color:var(--ink-soft);text-align:center;letter-spacing:.04em}
  .welcome-em{font-size:40px;margin-bottom:18px}
</style>
</head>
<body>

    <p class="lead">
      합류를 축하드려요! 6가지 트랙 중에서 <b style="color:var(--ink)">무엇부터 시작해야 할지</b> 막막하실 수 있어요.<br/>
      간단한 10가지 질문으로, 지금 여러분에게 <b style="color:var(--ink)">가장 잘 맞는 트랙</b>을 찾아드릴게요.
    </p>
    <div class="note">
      ⏱️ 1분이면 충분해요. 한 달에 하나씩, 1년이면 모든 트랙을 경험하게 되니 부담 갖지 않으셔도 돼요.
    </div>
    <button class="cta full" id="start">나에게 맞는 트랙 찾기 →</button>
  </div>`;
  document.getElementById('start').addEventListener('click',()=>{
    step=0; answers.length=0; progWrap.classList.remove('hidden'); renderQuestion();
  });
}

function renderQuestion(){
  setBar();
  const Q = QUESTIONS[step];
  let html = `<div class="fade">
    <div class="q-count">질문 ${step+1} / ${QUESTIONS.length}</div>
    <h2 class="q">${Q.q}</h2>`;
  Q.opts.forEach((o,i)=>{
    html += `<button class="opt" data-i="${i}"><span class="em">${o.em}</span><span>${o.t}</span></button>`;
  });
  html += `<div class="btns">
    <button class="ghost" id="back">← ${step===0?'처음으로':'이전'}</button>
  </div></div>`;
  app.innerHTML = html;
  app.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>choose(parseInt(btn.dataset.i)));
  });
  document.getElementById('back').addEventListener('click',goBack);
}

function choose(i){
  answers[step] = i;
  step++;
  if(step < QUESTIONS.length) renderQuestion();
  else renderResult();
}

function goBack(){
  if(step===0){ renderWelcome(); return; }
  step--;
  renderQuestion();
}

let topTwo = [];      // [1순위key, 2순위key]
let primaryIdx = 0;   // 현재 크게 보고 있는 트랙 (0 or 1)
let PCT = {};         // 트랙별 매칭률

function computeScores(){
  const total = {}, max = {};
  Object.keys(TRACKS).forEach(k=>{ total[k]=0; max[k]=0; });
  QUESTIONS.forEach((Q,qi)=>{
    // 이 문항이 각 트랙에 줄 수 있는 최대 점수(가장 잘 맞는 답 기준)
    const best = {};
    Q.opts.forEach(o=>{ for(const k in o.s){ if(o.s[k] > (best[k]||0)) best[k]=o.s[k]; } });
    for(const k in best) max[k]+=best[k];
    // 실제 선택 점수
    const ai = answers[qi]; if(ai==null) return;
    const s = Q.opts[ai].s; for(const k in s) total[k]+=s[k];
  });
  return { total, max };
}

function renderResult(){
  const { total, max } = computeScores();
  /* 순위는 원점수(total)가 아니라 매칭 비율(total/max)로 매긴다.
     트랙마다 획득 가능한 최대점이 다르므로(빌더 30 vs 앱 24) 원점수로 세우면
     화면엔 '1순위 80% / 2순위 99%' 처럼 매칭률이 역전돼 보인다. */
  const ratio = k => total[k] / (max[k] || 1);
  const ranked = Object.keys(TRACKS).sort((a,b)=>ratio(b)-ratio(a));
  PCT = {};
  ranked.forEach(k=>{ PCT[k]=Math.max(48, Math.min(99, Math.round(ratio(k)*100))); });
  topTwo = [ranked[0], ranked[1]];
  primaryIdx = 0;
  paintResult();
}

function paintResult(){
  bar.style.width='100%';
  const isTop = primaryIdx===0;
  const pk = topTwo[primaryIdx], ok = topTwo[primaryIdx===0?1:0];
  const primary = TRACKS[pk], other = TRACKS[ok];
  const pct = PCT[pk], opct = PCT[ok];
  /* 정규 트랙은 요일당 1개만 신청 가능 (track-apply.html 요일별 라디오).
     11기엔 세일즈·나 탐구·빌더가 모두 월요일이라 1·2순위가 같은 요일로 겹칠 수 있음 → 미리 알려준다. */
  const sameDay = primary.day === other.day;
  app.innerHTML = `<div class="fade">
    <div class="eyebrow">Your Track</div>
    <h1 style="margin-bottom:20px">${isTop ? '당신에게 딱 맞는 트랙은' : '이 트랙도 잘 맞아요'}</h1>
    <div class="result-card">
      <div class="match">매칭률 <b>${pct}%</b><div class="match-bar"><i style="width:${pct}%"></i></div></div>
      <div class="result-em">${primary.em}</div>
      <span class="badge">${isTop?'추천 1순위':'추천 2순위'} · 4주 산출물 · ${primary.badge}</span>
      <div class="typeline">당신은 &lsquo;${primary.type}&rsquo; 타입</div>
      <h3>${primary.name}</h3>
      <div class="tag">매주 ${primary.day} · ${primary.tag}</div>
      <p class="why">${primary.why}</p>
    </div>
    <button class="sub-card" id="swap">
      <span class="em">${other.em}</span>
      <div style="flex:1"><div class="t">${isTop?`이 트랙도 잘 맞아요 · 매칭률 ${opct}%`:'추천 1순위 다시 보기'}${sameDay?' · 같은 요일이라 둘 중 하나만':''}</div><div class="n">${other.name} · 매주 ${other.day}</div></div>
      <span class="sub-cta">자세히 →</span>
    </button>
    <button class="cta full" id="apply">${primary.name} 신청하기 →</button>
    <div class="btns" style="justify-content:center">
      <button class="ghost" id="restart">↺ 다시 테스트하기</button>
    </div>
  </div>`;
  document.getElementById('swap').addEventListener('click',()=>{
    primaryIdx = primaryIdx===0?1:0; paintResult();
  });
  document.getElementById('restart').addEventListener('click',renderWelcome);
  document.getElementById('apply').addEventListener('click',()=>{
    /* 트랙 신청 폼으로 이동 (같은 탭). 상대경로라 vercel 프록시/오라클 직결 모두 동작.
       /apply 히어로 → 트랙 찾기 → 신청 으로 이어지는 단일 탭 루프 유지. */
    location.href='/apply';
  });
}

renderWelcome();
</script>
</body>
</html>
